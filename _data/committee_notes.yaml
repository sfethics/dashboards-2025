  '1471154': '"No on G, Save Sunset Dunes Sponsored by Friends of Sunset Dunes" is the same committee that previously operated as <a href="https://campaign.sfethics.org/elections/2024-11-05/committees/CA1471154">"Yes on K, Ocean Beach Park for All Sponsored by Community Nonprofits"</a>.<br> 
    The committee was primarily formed to support Measure K in the November 5, 2024 election and was subsequently redesignated to oppose Measure G in the November 3, 2026 election.<br>
    The financial activity shown on this page includes contributions and expenditures reported both before and after that change and is not limited to activity associated with Measure G.'